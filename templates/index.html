<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub PR Heatmap</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>Meu Monitoramento de Atividades (GitHub)</h1>
            <div class="search-bar" style="display: none;">
                <input type="text" id="username" placeholder="GitHub Username" value="yankamikaze" />
                <input type="number" id="year" placeholder="Year" value="2026" min="2000" max="2100"/>
                <button id="generate-btn">Generate Heatmap</button>
            </div>
            <div id="stats" class="stats"></div>
            <div id="error-message" class="error"></div>
        </header>

        <main>
            <div class="heatmap-container">
                <div class="months-labels" id="months-labels"></div>
                <div class="heatmap-body">
                    <div class="days-labels">
                        <div>Seg</div>
                        <div>Qua</div>
                        <div>Sex</div>
                    </div>
                    <div id="heatmap" class="heatmap">
                        <!-- Heatmap cells will be generated by JS -->
                    </div>
                </div>
                <div class="legend">
                    Menos 
                    <div class="color-scale">
                        <div class="cell level-0"></div>
                        <div class="cell level-1"></div>
                        <div class="cell level-2"></div>
                        <div class="cell level-3"></div>
                        <div class="cell level-4"></div>
                    </div>
                    Mais
                </div>
            </div>
            <div id="tooltip" class="tooltip"></div>
        </main>
    </div>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
